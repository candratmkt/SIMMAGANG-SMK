<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMMAGANG-SMK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8 shadow-lg rounded-4 overflow-hidden bg-white glass-card">
                <div class="row g-0">
                    <!-- Brand Section -->
                    <div class="col-md-5 bg-gradient-primary text-white p-5 d-flex flex-column justify-content-between align-items-center text-center">
                        <div>
                            <div class="mb-3">
                                <i class="fa-solid fa-graduation-cap fa-4x text-warning"></i>
                            </div>
                            <h3 class="fw-bold mb-2">SIMMAGANG</h3>
                            <p class="small text-white-50">Sistem Informasi Manajemen PKL SMK Terpadu</p>
                        </div>
                        <div class="w-100 mt-4">
                            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill w-100"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Beranda</a>
                        </div>
                    </div>

                    <!-- Login Form Section -->
                    <div class="col-md-7 p-4 p-md-5">
                        <div class="mb-4">
                            <h4 class="fw-bold text-dark mb-1">Selamat Datang!</h4>
                            <p class="text-muted small">Silakan masuk menggunakan akun terdaftar Anda</p>
                        </div>

                        <!-- Toast Alert Container -->
                        <div id="alertContainer"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small text-secondary">Email / Username / NISN</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0" id="email" placeholder="nama@smk.sch.id" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small text-secondary">Kata Sandi</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control bg-light border-start-0 border-end-0" id="password" placeholder="••••••••" required>
                                    <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePassword">
                                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4 small">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-muted" for="rememberMe">Ingat Saya</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none fw-semibold">Lupa Password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm d-flex align-items-center justify-content-center" id="btnLogin">
                                <span id="btnText"><i class="fa-solid fa-right-to-bracket me-2"></i> Masuk Sistem</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">Atau login simulasi cepat (Demo Mode):</p>
                            <div class="d-flex justify-content-center gap-1 mt-2 flex-wrap">
                                <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="quickLogin('admin')">Admin</button>
                                <button class="btn btn-outline-success btn-sm rounded-pill" onclick="quickLogin('siswa')">Siswa</button>
                                <button class="btn btn-outline-warning btn-sm rounded-pill" onclick="quickLogin('guru')">Guru</button>
                                <button class="btn btn-outline-info btn-sm rounded-pill" onclick="quickLogin('hubin')">Hubin</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Supabase Client & Logic Controller -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // 1. Inisialisasi Supabase
        const SUPABASE_URL = 'https://pqhnzcsmbytwiurchnzl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxaG56Y3NtYnl0d2l1cmNobnpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMjQ2NzIsImV4cCI6MjEwMDgwMDY3Mn0.B5nv0C75tqK0kdD7pB7NxXZGn8CWZz7HgR9mECyrLXE';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Cek Koneksi Otomatis ke Console
        (async () => {
            console.log("🔄 [LOGIN] Sedang menguji koneksi ke Supabase...");
            try {
                const { data, error } = await supabase.from('settings').select('key').limit(1);
                if (error) {
                    console.warn("⚠️ [LOGIN] Terhubung tapi respon error (Cek RLS/Tabel):", error.message);
                } else {
                    console.log("🟢 [LOGIN] BERHASIL! Halaman Login terhubung ke Supabase.");
                }
            } catch (err) {
                console.error("🔴 [LOGIN] KONEKSI GAGAL:", err);
            }
        })();

        // Helper untuk Tampilkan Alert UI
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alertContainer');
            if (alertContainer) {
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show small" role="alert">
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
            }
        }

        // 3. Form Submit Handler (Sistem Login Real + User Accounts Mapping)
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const usernameInput = document.getElementById('email').value.trim();
                const passwordInput = document.getElementById('password').value;
                const btnText = document.getElementById('btnText');
                const btnSpinner = document.getElementById('btnSpinner');

                btnText.classList.add('d-none');
                btnSpinner.classList.remove('d-none');

                try {
                    // A. Jika input berformat email biasa
                    let targetEmail = usernameInput;

                    // B. Jika input NIS/NIP/Username, cari email autentikasi dari tabel user_accounts
                    if (!usernameInput.includes('@')) {
                        const { data: userAcc, error: accErr } = await supabase
                            .from('user_accounts')
                            .select('auth_email')
                            .eq('username', usernameInput)
                            .maybeSingle();

                        if (accErr || !userAcc) {
                            showAlert('Username / NIS tidak ditemukan dalam sistem!');
                            return;
                        }
                        targetEmail = userAcc.auth_email;
                    }

                    // C. Lakukan Autentikasi ke Supabase Auth
                    const { data: authData, error: authErr } = await supabase.auth.signInWithPassword({
                        email: targetEmail,
                        password: passwordInput
                    });

                    if (authErr) {
                        showAlert('Kata sandi salah atau akun tidak aktif.');
                        return;
                    }

                    showAlert('Login berhasil! Mengalihkan ke dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);

                } catch (err) {
                    console.error('Login Error:', err);
                    showAlert('Terjadi kesalahan koneksi ke server.');
                } finally {
                    btnText.classList.remove('d-none');
                    btnSpinner.classList.add('d-none');
                }
            });
        }

        // 4. Toggle Password Visibility Button
        const toggleBtn = document.getElementById('togglePassword');
        const passInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        if (toggleBtn && passInput && eyeIcon) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passInput.type === 'password';
                passInput.type = isPassword ? 'text' : 'password';
                eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
            });
        }

        // 5. Global Function untuk Quick Login Demo Mode
        window.quickLogin = function(role) {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            if (emailInput && passwordInput) {
                emailInput.value = role;
                passwordInput.value = '12345678';
            }
        };
    </script>
</body>
</html>
