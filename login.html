<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMMAGANG-SMK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-body d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8 shadow-lg rounded-4 overflow-hidden bg-white glass-card">
                <div class="row g-0">
                    <!-- Brand Section -->
                    <div class="col-md-5 bg-gradient-primary text-white p-5 d-flex flex-column justify-content-between align-items-center text-center">
                        <div>
                            <div class="mb-3">
                                <i class="fa-solid fa-graduation-cap fa-4x text-warning"></i>
                            </div>
                            <h3 class="fw-bold mb-2">SIMMAGANG</h3>
                            <p class="small text-white-50">Sistem Informasi Manajemen PKL SMK Terpadu</p>
                        </div>
                        <div class="w-100 mt-4">
                            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill w-100"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Beranda</a>
                        </div>
                    </div>

                    <!-- Login Form Section -->
                    <div class="col-md-7 p-4 p-md-5">
                        <div class="mb-4">
                            <h4 class="fw-bold text-dark mb-1">Selamat Datang!</h4>
                            <p class="text-muted small">Silakan masuk menggunakan akun terdaftar Anda</p>
                        </div>

                        <!-- Toast Alert Container -->
                        <div id="alertContainer"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small text-secondary">Email / Username / NISN</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0" id="email" placeholder="nama@smk.sch.id" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold small text-secondary">Kata Sandi</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control bg-light border-start-0 border-end-0" id="password" placeholder="••••••••" required>
                                    <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePassword">
                                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4 small">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-muted" for="rememberMe">Ingat Saya</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none fw-semibold">Lupa Password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 shadow-sm d-flex align-items-center justify-content-center" id="btnLogin">
                                <span id="btnText"><i class="fa-solid fa-right-to-bracket me-2"></i> Masuk Sistem</span>
                                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <p class="text-muted small mb-0">Atau login simulasi cepat (Demo Mode):</p>
                            <div class="d-flex justify-content-center gap-1 mt-2 flex-wrap">
                                <button class="btn btn-outline-primary btn-sm rounded-pill" onclick="quickLogin('admin')">Admin</button>
                                <button class="btn btn-outline-success btn-sm rounded-pill" onclick="quickLogin('siswa')">Siswa</button>
                                <button class="btn btn-outline-warning btn-sm rounded-pill" onclick="quickLogin('guru')">Guru</button>
                                <button class="btn btn-outline-info btn-sm rounded-pill" onclick="quickLogin('hubin')">Hubin</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/login.js"></script>
</body>
</html>
