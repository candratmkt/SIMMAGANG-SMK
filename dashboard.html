<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SIMMAGANG SMK</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loaderOverlay">
        <div class="text-center">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <p class="mt-3 text-muted fw-semibold">Memuat Data Dashboard...</p>
        </div>
    </div>

    <!-- Navbar Top -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-helmet-safety me-2"></i>SIMMAGANG</a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-white d-none d-md-inline">
                    <i class="fa-regular fa-circle-user me-1"></i> <span id="navUserName">...</span>
                </span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="handleLogout()">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-4">
        
        <!-- Welcome & Profile Card -->
        <div class="card profile-card p-4 mb-4 shadow">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <span class="badge bg-warning text-dark badge-role mb-2" id="userRoleBadge">MEMUAT...</span>
                    <h2 class="fw-bold mb-1">Selamat Datang, <span id="welcomeName">Pengguna</span>! 👋</h2>
                    <p class="mb-0 opacity-75" id="userEmailText">loading email...</p>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <div class="p-3 bg-white bg-opacity-10 rounded-3 d-inline-block text-start">
                        <small class="d-block text-uppercase text-light opacity-75">Status Akun</small>
                        <span class="fw-bold text-success bg-white px-2 py-1 rounded small" id="statusBadge">
                            <i class="fa-solid fa-circle-check"></i> Aktif
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Judul Dinamis -->
        <h5 class="fw-bold mb-3 text-secondary" id="sectionTitle">
            <i class="fa-solid fa-grip me-2"></i>Menu Utama & Ringkasan
        </h5>
        
        <!-- ==================== 1. MENU SISWA ==================== -->
        <div id="roleSiswaSection" class="role-section d-none">
            <div class="row g-3">
                <!-- Absensi Siswa -->
                <div class="col-md-4">
                    <div class="card card-stat p-3 h-100">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-3 me-3 fs-3">
                                <i class="fa-solid fa-calendar-check"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Presensi Hari Ini</h6>
                                <h5 class="fw-bold mb-0 text-dark" id="statPresensiText">Belum Absen</h5>
                            </div>
                        </div>
                        <hr class="my-3">
                        <button class="btn btn-primary btn-sm w-100" id="btnAbsenSiswa" onclick="handleAbsenSiswa()">
                            <i class="fa-solid fa-camera me-1"></i> Absen Sekarang
                        </button>
                    </div>
                </div>

                <!-- Jurnal Harian Siswa -->
                <div class="col-md-4">
                    <div class="card card-stat p-3 h-100">
                        <div class="d-flex align-items-center">
                            <div class="bg-success bg-opacity-10 text-success p-3 rounded-3 me-3 fs-3">
                                <i class="fa-solid fa-book-bookmark"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Jurnal Harian</h6>
                                <h5 class="fw-bold mb-0 text-dark" id="statJurnalText">0 Entri Bulan Ini</h5>
                            </div>
                        </div>
                        <hr class="my-3">
                        <button class="btn btn-success btn-sm w-100" onclick="openModalJurnal()">
                            <i class="fa-solid fa-pen-to-square me-1"></i> Isi Jurnal Harian
                        </button>
                    </div>
                </div>

                <!-- Tempat Magang DUDI Siswa -->
                <div class="col-md-4">
                    <div class="card card-stat p-3 h-100">
                        <div class="d-flex align-items-center">
                            <div class="bg-info bg-opacity-10 text-info p-3 rounded-3 me-3 fs-3">
                                <i class="fa-solid fa-building-user"></i>
                            </div>
                            <div>
                                <h6 class="text-muted mb-1">Tempat Magang (DUDI)</h6>
                                <h5 class="fw-bold mb-0 text-dark" id="statDudiText">PT. Industri Perkasa</h5>
                            </div>
                        </div>
                        <hr class="my-3">
                        <button class="btn btn-outline-secondary btn-sm w-100">
                            <i class="fa-solid fa-eye me-1"></i> Detail DUDI
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section Role Lainnya (Guru, DUDI, Admin) -->
        <div id="roleGuruSection" class="role-section d-none"></div>
        <div id="roleDudiSection" class="role-section d-none"></div>
        <div id="roleAdminSection" class="role-section d-none"></div>

        <!-- Detail Informasi Pengguna (Shared) -->
        <div class="card card-stat mt-4 p-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="fa-solid fa-id-card me-2"></i>Informasi Akun</h5>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-0">Nama Lengkap</label>
                    <div class="fw-bold fs-6" id="infoNama">-</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-0">Email Sistem</label>
                    <div class="fw-bold fs-6" id="infoEmail">-</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-0">Peran Sistem (Role)</label>
                    <div class="fw-bold fs-6 text-uppercase" id="infoRole">-</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-muted small mb-0">ID Pengguna (UUID)</label>
                    <div class="fw-bold fs-6 font-monospace text-muted" id="infoUUID">-</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Input Jurnal Siswa -->
    <div class="modal fade" id="modalJurnalSiswa" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-pen-to-square text-success me-2"></i>Isi Jurnal Harian</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="formJurnalSiswa" onsubmit="handleSimpanJurnal(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label font-semibold">Tanggal Kegiatan</label>
                            <input type="date" class="form-control" id="jurnalTanggal" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label font-semibold">Deskripsi Kegiatan Magang</label>
                            <textarea class="form-control" id="jurnalKegiatan" rows="4" placeholder="Tuliskan kegiatan pekerjaan yang Anda lakukan hari ini..." required></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-success btn-sm" id="btnSimpanJurnal">Simpan Jurnal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JS CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Custom Project JS Modules -->
    <script src="js/supabase-config.js"></script>
    <script src="js/dashboard-siswa.js"></script>
    <script src="js/dashboard-main.js"></script>
</body>
</html>
